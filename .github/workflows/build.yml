name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish releases
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Test
        run: cargo test --locked
      # a glibc build: musl's allocator made it ~50% slower, and Wine needs glibc anyway
      - name: Build
        run: |
          cargo build --release --locked
          cp target/release/regstack regstack-x86_64-linux
      - uses: actions/upload-artifact@v4
        with:
          name: regstack-x86_64-linux
          path: regstack-x86_64-linux
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" regstack-x86_64-linux --title "$GITHUB_REF_NAME" --generate-notes
